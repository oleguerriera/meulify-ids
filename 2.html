<!DOCTYPE html>
<html lang="ca" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Vídeo a WebP Animat Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-full flex flex-col antialiased">

    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 p-2 rounded-xl text-white shadow-lg shadow-brand-600/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">WebP Animat Pro</h1>
                    <p class="text-xs text-slate-400">Conversió 100% local i segura via WebAssembly</p>
                </div>
            </div>
            <div id="engineStatusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusText">Inicialitzant motor FFmpeg...</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Panell de Control i Configuració (Esquerra) -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700/80 p-5 sm:p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    Paràmetres de sortida
                </h2>

                <div class="space-y-4">
                    <!-- Selector de fitxers -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Fitxers de vídeo</label>
                        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-600 hover:border-brand-500 rounded-xl p-4 cursor-pointer bg-slate-900/40 transition-all group">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400 group-hover:text-brand-400 mb-2 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                            <span class="text-xs font-medium text-slate-300 text-center">Tria o arrossega vídeos (MP4, MOV, etc.)</span>
                            <input type="file" id="fileInput" multiple accept="video/*" class="hidden">
                        </label>
                        <div id="fileCount" class="text-xs text-slate-400 mt-2 text-right">Cap fitxer seleccionat</div>
                    </div>

                    <!-- Resolució -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Amplada (px)</label>
                            <input type="number" id="width" placeholder="Auto" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Alçada (px)</label>
                            <input type="number" id="height" placeholder="Auto" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <!-- FPS i Qualitat -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">FPS</label>
                            <input type="number" id="fps" value="12" min="1" max="60" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Qualitat (0-100)</label>
                            <input type="number" id="quality" value="75" min="0" max="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <!-- Botó de conversió -->
                    <button id="convertBtn" disabled class="w-full mt-2 bg-brand-600 hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                        Començar Conversió
                    </button>
                </div>
            </div>
        </div>

        <!-- Panell de Progrés i Resultats (Dreta) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Targeta de Progrés en Temps Real -->
            <div id="progressCard" class="bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700/80 p-5 sm:p-6 shadow-xl hidden">
                <div class="flex justify-between items-center mb-3">
                    <span id="currentTaskLabel" class="text-sm font-medium text-slate-200 truncate">Preparant tasca...</span>
                    <span id="percentageLabel" class="text-sm font-bold text-brand-400 font-mono">0,00%</span>
                </div>
                <!-- Barra de progrés avançada -->
                <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                    <div id="progressBar" class="bg-gradient-to-r from-brand-600 to-indigo-400 h-full rounded-full transition-all duration-150" style="width: 0%"></div>
                </div>
                <div class="mt-3 flex justify-between items-center text-xs text-slate-400">
                    <span id="detailsLog">Llegint dades...</span>
                    <span id="fileProgressIndicator">0 / 0</span>
                </div>
            </div>

            <!-- Resultats -->
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700/80 p-5 sm:p-6 shadow-xl min-h-[300px] flex flex-col">
                <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
                    <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        Fitxers convertits
                    </h2>
                    <span id="resultCount" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-medium">0 resultats</span>
                </div>

                <div id="results" class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-grow">
                    <div id="emptyState" class="col-span-full flex flex-col items-center justify-center py-12 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <p class="text-sm font-medium">Els fitxers WebP generats apareixeran aquí</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';

        const ffmpeg = new FFmpeg();
        
        const statusText = document.getElementById('statusText');
        const engineStatusBadge = document.getElementById('engineStatusBadge');
        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('fileCount');
        const convertBtn = document.getElementById('convertBtn');
        
        const progressCard = document.getElementById('progressCard');
        const currentTaskLabel = document.getElementById('currentTaskLabel');
        const percentageLabel = document.getElementById('percentageLabel');
        const progressBar = document.getElementById('progressBar');
        const detailsLog = document.getElementById('detailsLog');
        const fileProgressIndicator = document.getElementById('fileProgressIndicator');
        
        const resultsDiv = document.getElementById('results');
        const emptyState = document.getElementById('emptyState');
        const resultCount = document.getElementById('resultCount');

        let totalFilesToProcess = 0;
        let currentFileIndex = 0;
        let lastKnownProgress = 0;

        // Feedback detallat de progrés d'FFmpeg
        ffmpeg.on('progress', ({ progress, time }) => {
            // El progrés pot venir com a float (0 a 1)
            let percentVal = progress * 100;
            if (isNaN(percentVal) || percentVal < 0) percentVal = 0;
            if (percentVal > 100) percentVal = 100;
            
            // Si el progrés s'encalla al principi o final, evitem salts estranys però mantenim fluïdesa
            lastKnownProgress = percentVal;

            const formattedPercent = percentVal.toFixed(2).replace('.', ',');
            progressBar.style.width = `${percentVal}%`;
            percentageLabel.innerText = `${formattedPercent}%`;
            
            if (time) {
                detailsLog.innerText = `Processant fotogrames... Temps transcorregut: ${(time / 1000000).toFixed(1)}s`;
            }
        });

        // Inicialització asíncrona del motor FFmpeg amb feedback visual pas a pas
        async function initEngine() {
            try {
                statusText.innerText = "Descarregant mòduls WebAssembly...";
                await ffmpeg.load({
                    coreURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js',
                    wasmURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm',
                });
                
                engineStatusBadge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                engineStatusBadge.querySelector('span').className = "w-2 h-2 rounded-full bg-emerald-400";
                statusText.innerText = "Motor preparat i actiu";
                
                if (fileInput.files.length > 0) {
                    convertBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                engineStatusBadge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                engineStatusBadge.querySelector('span').className = "w-2 h-2 rounded-full bg-red-400";
                statusText.innerText = "Error carregant el motor (comprova el servidor local)";
            }
        }

        initEngine();

        fileInput.addEventListener('change', () => {
            const count = fileInput.files.length;
            if (count > 0) {
                fileCount.innerText = `${count} fitxer(s) seleccionat(s)`;
                if (statusText.innerText === "Motor preparat i actiu") {
                    convertBtn.disabled = false;
                }
            } else {
                fileCount.innerText = "Cap fitxer seleccionat";
                convertBtn.disabled = true;
            }
        });

        convertBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            if (files.length === 0) return;

            convertBtn.disabled = true;
            fileInput.disabled = true;
            progressCard.classList.remove('hidden');
            if (emptyState) emptyState.remove();

            totalFilesToProcess = files.length;
            let successCount = 0;

            for (let i = 0; i < totalFilesToProcess; i++) {
                currentFileIndex = i + 1;
                const file = files[i];
                
                currentTaskLabel.innerText = `Processant: ${file.name}`;
                fileProgressIndicator.innerText = `Fitxer ${currentFileIndex} de ${totalFilesToProcess}`;
                progressBar.style.width = '0%';
                percentageLabel.innerText = '0,00%';
                detailsLog.innerText = 'Carregant a la memòria virtual...';

                const ext = file.name.split('.').pop();
                const inputName = `input_${i}.${ext}`;
                const outputName = `output_${i}.webp`;

                try {
                    // Escriptura del fitxer
                    await ffmpeg.writeFile(inputName, await fetchFile(file));

                    const width = document.getElementById('width').value;
                    const height = document.getElementById('height').value;
                    const fps = document.getElementById('fps').value || '12';
                    const quality = document.getElementById('quality').value || '75';

                    let vfFilter = `fps=${fps}`;
                    if (width || height) {
                        const w = width || '-1';
                        const h = height || '-1';
                        vfFilter += `,scale=${w}:${h}`;
                    }

                    detailsLog.innerText = 'Convertint a WebP animat...';

                    // Execució d'FFmpeg
                    await ffmpeg.exec([
                        '-i', inputName,
                        '-vcodec', 'libwebp',
                        '-vf', vfFilter,
                        '-q:v', quality,
                        '-loop', '0',
                        '-an',
                        outputName
                    ]);

                    progressBar.style.width = '100%';
                    percentageLabel.innerText = '100,00%';
                    detailsLog.innerText = 'Conversió completada amb èxit!';

                    // Lectura del resultat
                    const data = await ffmpeg.readFile(outputName);
                    const blob = new Blob([data.buffer], { type: 'image/webp' });
                    const url = URL.createObjectURL(blob);
                    const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);

                    // Renderització de la targeta de resultat
                    const card = document.createElement('div');
                    card.className = "bg-slate-900/80 border border-slate-700 rounded-xl p-4 flex flex-col justify-between shadow-lg";
                    
                    card.innerHTML = `
                        <div>
                            <div class="w-full h-36 bg-slate-950 rounded-lg overflow-hidden mb-3 flex items-center justify-center border border-slate-800">
                                <img src="${url}" class="max-h-full max-w-full object-contain" alt="Prevenda WebP">
                            </div>
                            <h3 class="text-xs font-semibold text-slate-200 truncate mb-1" title="${file.name}">${file.name}</h3>
                            <p class="text-[11px] text-slate-400 mb-3">Mida: <span class="text-slate-200 font-mono">${sizeMB} MB</span></p>
                        </div>
                        <a href="${url}" download="${file.name.substring(0, file.name.lastIndexOf('.')) || file.name}_animat.webp" 
                           class="w-full bg-brand-600/20 hover:bg-brand-600 text-brand-300 hover:text-white border border-brand-500/30 text-xs font-semibold py-2 px-3 rounded-lg text-center transition-all flex items-center justify-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            Descarrega WebP
                        </a>
                    `;

                    resultsDiv.appendChild(card);
                    successCount++;
                    resultCount.innerText = `${successCount} resultats`;

                    // Netejar fitxers temporals de la memòria d'FFmpeg
                    await ffmpeg.deleteFile(inputName);
                    await ffmpeg.deleteFile(outputName);

                } catch (err) {
                    console.error(`Error amb ${file.name}:`, err);
                    detailsLog.innerText = `Error processant ${file.name}`;
                }
            }

            currentTaskLabel.innerText = "Procés finalitzat!";
            convertBtn.disabled = false;
            fileInput.disabled = false;
        });
    </script>
</body>
</html>
